name: CI

on:
  pull_request:
  push:
    # `dev` collects every PR and is only tested; a push to `main` (a dev → main merge) is what
    # publishes a release, see the `release-artifact` job condition.
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      production: ${{ steps.filter.outputs.production }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            production:
              - 'Sources/**'
              - 'App/**'
              - 'Tests/**'
              - 'Beepbar.xcodeproj/**'
              - 'scripts/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'CHANGELOG.md'
              - '.github/workflows/ci.yml'

  test:
    name: Test
    runs-on: xcode-27
    concurrency:
      # Release and manual runs get unique groups so no validation prerequisite is dropped.
      group: ${{ github.workflow }}-test-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        id: toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"
          echo "fingerprint=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache package dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            build/SourcePackages
          key: packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Beepbar.xcodeproj/project.pbxproj', 'Beepbar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Tooling tests that need no Swift build (#215, #222): cheap, so they run before `swift test`.
      # `scripts/recordings-seen-isolated-tests.py` is not here: it builds a temporary Swift package.
      - name: Benchmark comparison tests
        run: python3 scripts/test_benchmark_compare.py
      - name: UI benchmark driver tests
        run: python3 scripts/test_ui_benchmark.py
      - name: Linux test wrapper tests
        run: bash scripts/test-linux-core-tests.sh
      - name: Swift tests
        run: swift test
      - name: Verify readable release notes
        run: bash scripts/test-release-notes.sh
      - name: Verify release version numbering
        run: bash scripts/test-build-version.sh
      - name: Build and verify Release app
        run: |
          xcodebuild -project Beepbar.xcodeproj -target Beepbar -configuration Release -clonedSourcePackagesDirPath build/SourcePackages build CODE_SIGNING_ALLOWED=NO
          file build/Release/Beepbar.app/Contents/MacOS/Beepbar | grep -q 'arm64'
          plutil -lint build/Release/Beepbar.app/Contents/Info.plist
          test -f build/Release/Beepbar.app/Contents/Resources/Assets.car
          test -d build/Release/Beepbar.app/Contents/Frameworks/Sparkle.framework
          codesign --force --deep --sign - --identifier io.github.tvaccari.beepbar build/Release/Beepbar.app
          codesign --verify --deep --strict --verbose=2 build/Release/Beepbar.app

  release-artifact:
    name: Release DMG
    runs-on: xcode-27
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.production == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Changelog release gate (issue #210), first so a bad changelog fails before the build.
      # `release-notes.sh` refuses a non-empty `## Unreleased`, a newest dated section without
      # highlights, and notes identical to those of the last published release, whose CHANGELOG.md
      # is read from its `v*` tag (all tags are fetched above). Without such a tag, or with an
      # older changelog format there, the comparison is skipped. Consequence: a push to `main`
      # that publishes a release needs its own dated CHANGELOG section. The later appcast step
      # uses the `release-notes.md` written here.
      - name: Verify release notes
        run: |
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          : > previous-changelog.md
          if [ -n "$PREVIOUS_TAG" ] && git cat-file -e "$PREVIOUS_TAG:CHANGELOG.md" 2>/dev/null; then
            git show "$PREVIOUS_TAG:CHANGELOG.md" > previous-changelog.md
          fi
          bash scripts/release-notes.sh CHANGELOG.md previous-changelog.md > release-notes.md
      - name: Verify toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"
      # The version follows the last published release's `v*` tag (the same lookup as the release
      # notes step): a higher MARKETING_VERSION starts at patch 0 (3.0 after v2.2.35 is 3.0.0), the
      # same one moves the patch up by one. It fails closed rather than publish a version twice:
      # no previous tag (tags not fetched), this commit already released, or the tag already taken.
      - name: Compute build version
        run: |
          BASE_VERSION=$(xcodebuild -project Beepbar.xcodeproj -target Beepbar -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION =/ { print $3 }')
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then echo "No previous v* release tag found" >&2; exit 1; fi
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then echo "This commit is already released as $(git tag --points-at HEAD --list 'v[0-9]*')" >&2; exit 1; fi
          FULL_VERSION=$(scripts/build-version.sh "$BASE_VERSION" "$PREVIOUS_TAG")
          if git rev-parse -q --verify "refs/tags/v$FULL_VERSION" >/dev/null; then echo "Tag v$FULL_VERSION already exists" >&2; exit 1; fi
          echo "Releasing $FULL_VERSION (previous: $PREVIOUS_TAG)"
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
      - name: Build arm64 Release app
        run: xcodebuild -project Beepbar.xcodeproj -target Beepbar -configuration Release build CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=$FULL_VERSION CURRENT_PROJECT_VERSION=$FULL_VERSION
      - name: Verify app
        run: |
          file build/Release/Beepbar.app/Contents/MacOS/Beepbar | grep -q 'arm64'
          codesign --force --deep --sign - --identifier io.github.tvaccari.beepbar build/Release/Beepbar.app
          codesign --verify --deep --strict --verbose=2 build/Release/Beepbar.app
      - name: Create DMG
        run: scripts/create-dmg.sh build/Release/Beepbar.app build/00-Beepbar.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Beepbar-dmg
          path: build/00-Beepbar.dmg
          if-no-files-found: error
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz" -o /tmp/sparkle.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  /tmp/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p /tmp/sparkle-tools
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Release/Beepbar.app/Contents/Info.plist)
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle-tools/bin/sign_update --ed-key-file - build/00-Beepbar.dmg -p)
          LENGTH=$(stat -f%z build/00-Beepbar.dmg)
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          test -s release-notes.md
          cat > release-body.md <<BODYEOF
          [**Download BeepBar for macOS**](https://github.com/${{ github.repository }}/releases/latest/download/00-Beepbar.dmg)

          Built automatically from \`main\` on every push. The link above always resolves to the newest release.

          Built from commit [\`${GITHUB_SHA}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}). Ad-hoc signed, not notarized — see the [README](https://github.com/${{ github.repository }}#tldr--install) for the first-launch Gatekeeper step.

          ## What’s new in BeepBar $SHORT_VERSION

          $(cat release-notes.md)
          BODYEOF
          cat > appcast.xml <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>BeepBar</title>
              <item>
                <title>BeepBar $SHORT_VERSION</title>
                <pubDate>$PUBDATE</pubDate>
                <sparkle:version>$SHORT_VERSION</sparkle:version>
                <sparkle:shortVersionString>$SHORT_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <description sparkle:format="markdown"><![CDATA[[View the changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)]]></description>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/v$FULL_VERSION/00-Beepbar.dmg" sparkle:version="$SHORT_VERSION" sparkle:edSignature="$SIGNATURE" length="$LENGTH" type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XMLEOF
          ! grep -q 'sparkle:releaseNotesLink' appcast.xml
          grep -Fq '[View the changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)' appcast.xml
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.FULL_VERSION }}
          body_path: release-body.md
          prerelease: false
          make_latest: true
          files: |
            build/00-Beepbar.dmg
            appcast.xml
      # The `latest` tag and its "Legacy update feed" release are frozen at v2.2.35 and must stay
      # published, together with the `v2.2.35` release and its `00-Beepbar.dmg`: the frozen
      # appcast's enclosure points to that DMG. Builds 2.0.31–2.0.42 (before v2.0.44) still look
      # for `T-vaccari/Beepbar/releases/download/latest/appcast.xml`, which GitHub redirects
      # here. They update to v2.2.35, whose SUFeedURL points to
      # `releases/latest/download/appcast.xml`, and from there they follow the versioned
      # releases above. Deleting either release would leave them without updates.
